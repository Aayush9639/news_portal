{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-8 col-md-10">

        <!-- FORM CARD -->
        <div class="card shadow-sm p-4 form-card">

            <h3 class="text-center mb-3">📝 Submit Article</h3>
            <p class="text-center text-muted mb-4">
                Create and publish your news article
            </p>

            <form method="POST">
                {% csrf_token %}

                <!-- Title -->
                <div class="mb-3">
                    <label class="form-label"><strong>📌 Title</strong></label>
                    {{ form.title }}
                </div>

                <!-- Category -->
                <div class="mb-3">
                    <label class="form-label"><strong>📂 Category</strong></label>
                    {{ form.category }}
                </div>

                <!-- State and City Row -->
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label"><strong>🗺️ State</strong></label>
                        {{ form.state }}
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label"><strong>🏙️ City</strong></label>
                        {{ form.city }}
                    </div>
                </div>

                <!-- Content -->
                <div class="mb-3">
                    <label class="form-label"><strong>✍️ Content</strong></label>
                    {{ form.content }}
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a href="{% url 'journalist_dashboard' %}" 
                       class="btn btn-outline-secondary">
                        ← Back
                    </a>

                    <button type="submit" class="btn btn-primary">
                        🚀 Submit
                    </button>
                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
