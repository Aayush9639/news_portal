<h1>Journalist Dashboard</h1>

<p>Welcome {{ user.first_name }}</p>

<a href="{% url 'submit_article' %}">Submit New Article</a>

<hr>

<h3>Your Articles</h3>

<table border="1">
    <tr>
        <th>Title</th>
        <th>Status</th>
        <th>Created</th>
        <th>Actions</th>
    </tr>

    {% for article in articles %}
    <tr>
        <td>{{ article.title }}</td>
        <td>{{ article.status }}</td>
        <td>{{ article.created_at }}</td>
        <td>
            <a href="{% url 'edit_article' article.id %}">Edit</a>
            <a href="{% url 'delete_article' article.id %}">Delete</a>
        </td>

    </tr>
    {% empty %}
    <tr>
        <td colspan="4">No articles yet</td>
    </tr>
    {% endfor %}
</table>
<a href="{% url 'logout' %}">Logout</a>
