<h2>Manage Users</h2>

<table border="1">
    <tr>
        <th>Username</th>
        <th>Email</th>
        <th>Role</th>
        <th>Actions</th>
    </tr>

    {% for user in users %}
    <tr>
        <td>{{ user.username }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.role }}</td>
        <td>
            <a href="{% url 'edit_user' user.id %}">Edit</a> |
            <a href="{% url 'delete_user' user.id %}" onclick="return confirm('Delete this user?')">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>
