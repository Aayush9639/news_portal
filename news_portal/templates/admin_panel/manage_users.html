{% extends 'base.html' %}

{% block content %}
<h2>👥 Manage Users</h2>

<table class="table table-hover shadow-sm">
    <thead class="thead-light">
        <tr>
            <th>Username</th>
            <th>Email</th>
            <th>Role</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody>
        {% for user in users %}
        <tr>
            <td>{{ user.username }}</td>
            <td>{{ user.email }}</td>
            <td>
                <span class="role-badge role-{{ user.role }}">
                    {{ user.role|title }}
                </span>
            </td>
            <td class="action-links">
                <a href="{% url 'edit_user' user.id %}" class="btn btn-sm btn-edit">Edit</a> |
                <a href="{% url 'delete_user' user.id %}" onclick="return confirm('Delete this user?')" class="btn btn-sm btn-delete">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
