{% extends 'base.html' %}

{% block content %}

<div class="d-flex justify-content-center">
    <div class="card p-4 shadow form-card">

        <h3 class="text-center mb-4">✏️ Edit User</h3>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Username</label>
                {{ form.username }}
            </div>

            <div class="mb-3">
                <label class="form-label">First Name</label>
                {{ form.first_name }}
            </div>

            <div class="mb-3">
                <label class="form-label">Last Name</label>
                {{ form.last_name }}
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                {{ form.email }}
            </div>

            <div class="mb-3">
                <label class="form-label">Role</label>
                {{ form.role }}
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Update User
            </button>

        </form>

        <a href="{% url 'manage_users' %}" class="btn btn-outline-secondary mt-3">
            ← Back
        </a>

    </div>
</div>

{% endblock %}
