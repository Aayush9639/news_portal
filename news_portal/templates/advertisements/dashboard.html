{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>📢 Advertiser Dashboard</h2>

        <div>
            <a href="{% url 'create_ad' %}" class="btn btn-success me-2">
                ➕ Create Ad
            </a>
        </div>
    </div>

    <!-- TABLE CARD -->
    <div class="card shadow-sm p-3">

        <div class="table-responsive">
            <table class="table table-hover align-middle">

                <thead class="table-light">
                    <tr>
                        <th>Title</th>
                        <th>Status</th>
                        <th class="text-center">Actions</th>
                    </tr>
                </thead>

                <tbody>
                    {% for ad in ads %}
                    <tr>
                        <td>{{ ad.title }}</td>

                        <!-- STATUS BADGE -->
                        <td>
                            <span class="badge status-{{ ad.status }}">
                                {{ ad.status|title }}
                            </span>
                        </td>

                        <!-- ACTION BUTTONS -->
                        <td class="text-center">
                            <a href="{% url 'edit_ad' id=ad.id %}" 
                               class="btn btn-edit btn-sm">
                                ✏️ Edit
                            </a>

                            <a href="{% url 'delete_ad' id=ad.id %}" 
                               class="btn btn-delete btn-sm">
                                🗑 Delete
                            </a>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="3" class="text-center text-muted">
                            No ads created yet
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>

            </table>
        </div>

    </div>

</div>

{% endblock %}
